<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Fish</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Flappy Fish</h1>
  <canvas id="gameCanvas" width="320" height="480"></canvas>
  <div id="score">Score: 0</div>
  <button id="restartBtn">Play Again</button>
  <div id="offlineNotice">⚠️ No Internet Connection</div>

  <audio id="bgMusic" loop>
    <source src="assets/background.mp3" type="audio/mpeg">
  </audio>
  <audio id="flapSound">
    <source src="assets/flap.wav" type="audio/wav">
  </audio>
  <audio id="scoreSound">
    <source src="assets/score.wav" type="audio/wav">
  </audio>

  <script src="script.js"></script>
</body>
</html>
